<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 할일</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1f2430;
    --muted: #8a8f9c;
    --accent: #6c5ce7;
    --accent-light: #efeafd;
    --done: #b8bcc6;
    --border: #e6e8ec;
    --danger: #ff6b6b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171d;
      --card-bg: #1f2129;
      --text: #eceef2;
      --muted: #8a8f9c;
      --accent: #8f7bf0;
      --accent-light: #2a2540;
      --done: #565a66;
      --border: #2c2e38;
      --danger: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  header {
    margin-bottom: 24px;
  }
  header .date {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 4px;
  }
  header h1 {
    font-size: 28px;
    margin: 0;
  }
  .progress-wrap {
    margin-top: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 8px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin: 20px 0;
  }
  .input-row input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  .input-row input[type="text"]:focus {
    border-color: var(--accent);
  }
  .input-row button {
    padding: 0 20px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .input-row button:active { transform: scale(0.97); }

  ul.todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  li.todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 14px;
  }
  .checkbox {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }
  .checkbox.checked {
    background: var(--accent);
  }
  .checkbox.checked::after {
    content: "";
    width: 6px;
    height: 10px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  .todo-text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }
  li.todo-item.done .todo-text {
    color: var(--done);
    text-decoration: line-through;
  }
  .delete-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
    border-radius: 8px;
  }
  .delete-btn:hover {
    color: var(--danger);
    background: var(--accent-light);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 14px;
  }
  .footer-actions {
    margin-top: 18px;
    display: flex;
    justify-content: flex-end;
  }
  .footer-actions button {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="date" id="today-date"></div>
      <h1>오늘의 할일</h1>
      <div class="progress-wrap">
        <div class="progress-top">
          <span id="progress-label">0 / 0 완료</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>
    </header>

    <div class="input-row">
      <input type="text" id="todo-input" placeholder="할 일을 입력하세요" maxlength="200" />
      <button id="add-btn">추가</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>
    <div class="empty" id="empty-msg" style="display:none;">아직 할 일이 없어요. 첫 할일을 추가해보세요!</div>

    <div class="footer-actions">
      <button id="clear-done-btn">완료된 항목 지우기</button>
    </div>
  </div>

<script>
(function () {
  const STORAGE_KEY = 'today-todo-items';

  const todoInput = document.getElementById('todo-input');
  const addBtn = document.getElementById('add-btn');
  const todoList = document.getElementById('todo-list');
  const emptyMsg = document.getElementById('empty-msg');
  const progressLabel = document.getElementById('progress-label');
  const progressPercent = document.getElementById('progress-percent');
  const progressFill = document.getElementById('progress-fill');
  const clearDoneBtn = document.getElementById('clear-done-btn');
  const todayDateEl = document.getElementById('today-date');

  function formatToday() {
    const d = new Date();
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
  }
  todayDateEl.textContent = formatToday();

  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTodos(todos) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  let todos = loadTodos();

  function render() {
    todoList.innerHTML = '';
    if (todos.length === 0) {
      emptyMsg.style.display = 'block';
    } else {
      emptyMsg.style.display = 'none';
      todos.forEach((todo) => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (todo.done ? ' done' : '');

        const checkbox = document.createElement('div');
        checkbox.className = 'checkbox' + (todo.done ? ' checked' : '');
        checkbox.addEventListener('click', () => toggleDone(todo.id));

        const text = document.createElement('div');
        text.className = 'todo-text';
        text.textContent = todo.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.innerHTML = '&times;';
        deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(deleteBtn);
        todoList.appendChild(li);
      });
    }

    const total = todos.length;
    const doneCount = todos.filter((t) => t.done).length;
    const percent = total === 0 ? 0 : Math.round((doneCount / total) * 100);
    progressLabel.textContent = `${doneCount} / ${total} 완료`;
    progressPercent.textContent = `${percent}%`;
    progressFill.style.width = `${percent}%`;
  }

  function addTodo() {
    const value = todoInput.value.trim();
    if (!value) return;
    todos.push({ id: Date.now() + Math.random(), text: value, done: false });
    saveTodos(todos);
    todoInput.value = '';
    render();
    todoInput.focus();
  }

  function toggleDone(id) {
    todos = todos.map((t) => (t.id === id ? { ...t, done: !t.done } : t));
    saveTodos(todos);
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter((t) => t.id !== id);
    saveTodos(todos);
    render();
  }

  function clearDone() {
    todos = todos.filter((t) => !t.done);
    saveTodos(todos);
    render();
  }

  addBtn.addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTodo();
  });
  clearDoneBtn.addEventListener('click', clearDone);

  render();
})();
</script>
</body>
</html>
